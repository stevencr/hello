<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b16">
<title>Hello — Steven Cranfield</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:#080b16;color:#fff;overflow:hidden}.page{min-height:100vh;display:grid;place-items:center;position:relative;padding:24px;background:radial-gradient(circle at 20% 20%,rgba(56,189,248,.18),transparent 30%),radial-gradient(circle at 80% 75%,rgba(168,85,247,.2),transparent 32%),linear-gradient(135deg,#080b16,#111827)}.orb{position:absolute;width:320px;height:320px;border-radius:50%;filter:blur(80px);opacity:.4;animation:float 9s ease-in-out infinite}.one{top:4%;left:5%;background:#38bdf8}.two{right:2%;bottom:0;background:#a855f7;animation-delay:-4s}.card{width:min(760px,100%);padding:clamp(42px,8vw,78px);text-align:center;border:1px solid rgba(255,255,255,.13);border-radius:32px;background:rgba(17,24,39,.58);backdrop-filter:blur(22px);box-shadow:0 30px 100px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.08);animation:appear .8s ease both}.badge{display:inline-flex;align-items:center;gap:9px;padding:9px 14px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.06);color:#cbd5e1;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 14px #4ade80}h1{margin:28px 0 18px;font-size:clamp(4.5rem,13vw,8rem);line-height:.88;letter-spacing:-.075em;background:linear-gradient(120deg,#fff,#bae6fd 45%,#ddd6fe);-webkit-background-clip:text;background-clip:text;color:transparent}p{max-width:560px;margin:auto;color:#94a3b8;font-size:clamp(1rem,2.5vw,1.2rem);line-height:1.7}strong{color:#e2e8f0}.button{display:inline-flex;margin-top:34px;padding:14px 22px;border-radius:14px;color:#fff;text-decoration:none;font-weight:650;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);transition:.2s}.button:hover{transform:translateY(-3px);background:rgba(255,255,255,.17)}footer{margin-top:34px;color:#64748b;font-size:.82rem}@keyframes appear{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-20px) scale(1.08)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="page"><div class="orb one"></div><div class="orb two"></div><section class="card"><div class="badge"><span class="dot"></span> Online &amp; ready</div><h1>Hello.</h1><p>A tiny corner of the web, made to look a little less tiny. Welcome to the <strong>hello</strong> project.</p><a class="button" href="https://github.com/stevencr/hello">View the project&nbsp; →</a><footer>Built with plain HTML, CSS &amp; a little bit of sparkle.</footer></section></main>
</body>
</html>
