<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:linear-gradient(135deg,#0f172a,#312e81,#0f766e);display:grid;place-items:center;overflow:hidden}.glow{position:fixed;width:420px;height:420px;border-radius:50%;background:rgba(125,211,252,.2);filter:blur(80px);top:-120px;left:-100px}.glow2{position:fixed;width:380px;height:380px;border-radius:50%;background:rgba(216,180,254,.18);filter:blur(80px);right:-100px;bottom:-100px}.card{position:relative;width:min(720px,calc(100% - 40px));padding:70px 45px;text-align:center;border:1px solid rgba(255,255,255,.2);border-radius:30px;background:rgba(255,255,255,.1);backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.3)}.icon{font-size:3rem;margin-bottom:15px}h1{margin:0;font-size:clamp(3.5rem,10vw,6rem);letter-spacing:-.06em;line-height:1;background:linear-gradient(90deg,#fff,#bae6fd,#ddd6fe);-webkit-background-clip:text;background-clip:text;color:transparent}h2{font-size:clamp(1.3rem,3vw,2rem);margin:25px 0 12px}p{margin:0 auto;max-width:500px;color:#dbeafe;font-size:1.1rem;line-height:1.7}.button{display:inline-block;margin-top:32px;padding:14px 24px;border-radius:14px;background:#fff;color:#172033;text-decoration:none;font-weight:700;transition:.2s}.button:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.25)}footer{margin-top:35px;color:#bfdbfe;font-size:.85rem}@media(prefers-reduced-motion:no-preference){.card{animation:in .7s ease-out}.icon{animation:bob 3s ease-in-out infinite}}@keyframes in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}@keyframes bob{50%{transform:translateY(-7px)}}
</style>
</head>
<body>
<div class="glow"></div><div class="glow2"></div>
<main class="card">
<div class="icon">👋</div>
<h1>Welcome!</h1>
<h2>It's great to have you here.</h2>
<p>This is the <strong>Hello</strong> project — a little space on the web for whatever comes next.</p>
<a class="button" href="https://github.com/stevencr/hello">Explore the project →</a>
<footer>Thanks for stopping by.</footer>
</main>
</body>
</html>
